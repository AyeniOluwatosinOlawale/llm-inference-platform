#cloud-config
# k3s GPU worker agent bootstrap.
# __K3S_URL__ and __K3S_TOKEN__ are replaced by provision/vastai/vastai.py at runtime.

package_update: true
packages:
  - curl
  - open-iscsi

runcmd:
  # Install NVIDIA container toolkit.
  - |
    distribution=$(. /etc/os-release; echo $ID$VERSION_ID)
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    curl -s -L https://nvidia.github.io/libnvidia-container/$distribution/libnvidia-container.list | \
      sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
      tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
    apt-get update && apt-get install -y nvidia-container-toolkit
    nvidia-ctk runtime configure --runtime=containerd
    systemctl restart containerd

  # Join k3s cluster as agent with GPU resource exposure.
  - |
    K3S_URL=__K3S_URL__
    K3S_TOKEN=__K3S_TOKEN__
    curl -sfL https://get.k3s.io | K3S_URL=$K3S_URL K3S_TOKEN=$K3S_TOKEN sh -s - agent \
      --node-label "role=gpu-serving" \
      --node-label "nvidia.com/gpu.present=true" \
      --kubelet-arg "feature-gates=DevicePlugins=true"

final_message: "k3s GPU agent joined cluster"
