apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-nodes

      # Taint matches the tolerations on vLLM and SGLang deployments.
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

      requirements:
        # g5 family = A10G GPU. g5.xlarge = 1x A10G 24GB VRAM, 4 vCPU, 16GB RAM.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["g5"]

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge"]

        # Try spot first (~70% cheaper). Fall back to on-demand on interruption.
        # Karpenter handles the 2-minute spot interruption notice via the SQS queue:
        # it cordons + drains the node and launches a replacement before termination.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # Stay in us-east-1 to minimise cross-AZ data transfer costs and keep
        # latency consistent between GPU nodes and the CPU node group.
        - key: topology.kubernetes.io/region
          operator: In
          values: ["us-east-1"]

        # Spread across all AZs for spot availability — g5 spot pools are AZ-specific.
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-1a", "us-east-1b", "us-east-1c"]

  # Scale up aggressively, consolidate slowly — LLM pods are expensive to restart
  # (10-minute model load). Only consolidate when a node has been underutilised
  # for 10 full minutes to avoid premature evictions under bursty traffic.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      # Never disrupt more than 1 GPU node at a time during consolidation.
      - maxUnavailable: "1"

  # Hard cap: 4 GPU nodes max to keep spend bounded (~$4/hr spot at peak).
  limits:
    nvidia.com/gpu: "4"
