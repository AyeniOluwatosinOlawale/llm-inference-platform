# ALB Ingress — sits in front of Traefik with WAF attached.
# Traffic flow: Internet → ALB (WAF) → Traefik Service → Traefik pods → backends.
# The WAF_ACL_ARN annotation is substituted by make deploy-waf from terraform output.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-waf-ingress
  namespace: traefik
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    # WAF WebACL association — substituted from: terraform output -raw waf_acl_arn
    alb.ingress.kubernetes.io/wafv2-acl-arn: "${WAF_ACL_ARN}"
    # Health check against Traefik's ping endpoint.
    alb.ingress.kubernetes.io/healthcheck-path: "/ping"
    alb.ingress.kubernetes.io/healthcheck-port: "9000"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  number: 443
