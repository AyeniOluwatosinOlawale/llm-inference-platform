# ClusterSecretStore — cluster-wide connection to AWS Secrets Manager.
# Uses IRSA (the ESO ServiceAccount has an IAM role that allows GetSecretValue).
# AWS_REGION is substituted at deploy time by make deploy-eso.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: "${AWS_REGION}"
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
