# ExternalSecret — platform secrets (HuggingFace token, LiteLLM master key).
# ESO syncs from AWS Secrets Manager every 1 hour and writes a K8s Secret.
# Replaces: kubectl create secret generic platform-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-secrets
  namespace: llm-serving
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: HUGGINGFACE_TOKEN
      remoteRef:
        key: "${CLUSTER_NAME}/platform"
        property: HUGGINGFACE_TOKEN
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: "${CLUSTER_NAME}/platform"
        property: LITELLM_MASTER_KEY
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: "${CLUSTER_NAME}/platform"
        property: GRAFANA_ADMIN_PASSWORD
---
# ExternalSecret — LiteLLM gateway secrets (Redis, Postgres, database URL).
# Replaces: kubectl create secret generic litellm-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: "${CLUSTER_NAME}/litellm"
        property: REDIS_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "${CLUSTER_NAME}/litellm"
        property: POSTGRES_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: "${CLUSTER_NAME}/litellm"
        property: DATABASE_URL
