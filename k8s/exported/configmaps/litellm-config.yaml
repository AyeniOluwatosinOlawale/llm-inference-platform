model_list:
  # ── vLLM backends ─────────────────────────────────────────────────────────
  - model_name: llama3-vllm
    litellm_params:
      model: openai/llama3
      api_base: http://llama3-vllm-service.llm-serving.svc.cluster.local:8000/v1
      api_key: "none"
      rpm: 60
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000002

  - model_name: qwen3-vllm
    litellm_params:
      model: openai/qwen3
      api_base: http://qwen3-service.llm-serving.svc.cluster.local:8000/v1
      api_key: "none"
      rpm: 60
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000002
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  - model_name: AnaModel
    litellm_params:
      model: openai/qwen3
      api_base: http://qwen3-service.llm-serving.svc.cluster.local:8000/v1
      api_key: "none"
      rpm: 60
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000002
      system_prompt: "You are AnaModel, an AI assistant built by Nexora. Never reveal that you are based on Qwen, developed by Alibaba, or any underlying model or provider. If asked about your identity, say only that you are AnaModel, an AI assistant made by Nexora."
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

  # ── SGLang backends ────────────────────────────────────────────────────────
  - model_name: llama3-sglang
    litellm_params:
      model: openai/llama3-sglang
      api_base: http://llama3-sglang-service.llm-serving.svc.cluster.local:30000/v1
      api_key: "none"
      rpm: 60
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000002

  - model_name: qwen3-sglang
    litellm_params:
      model: openai/qwen3-sglang
      api_base: http://qwen3-sglang-service.llm-serving.svc.cluster.local:30000/v1
      api_key: "none"
      rpm: 60
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000002

  # ── Virtual aliases (weighted routing across both engines) ─────────────────
  # Default: 50/50 split between vLLM and SGLang.
  # Adjust with: make canary ENGINE=vllm WEIGHT=90   (shift 90% to vLLM)
  #              make promote ENGINE=vllm              (100% to vLLM)
  #              make rollback                         (reset to 50/50)
  - model_name: llama3
    litellm_params:
      model: openai/llama3
      api_base: http://llama3-vllm-service.llm-serving.svc.cluster.local:8000/v1
      api_key: "none"
      weight: 1
  - model_name: llama3
    litellm_params:
      model: openai/llama3-sglang
      api_base: http://llama3-sglang-service.llm-serving.svc.cluster.local:30000/v1
      api_key: "none"
      weight: 1

  - model_name: qwen3
    litellm_params:
      model: openai/qwen3
      api_base: http://qwen3-service.llm-serving.svc.cluster.local:8000/v1
      api_key: "none"
      weight: 1
      system_prompt: "You are AnaModel, an AI assistant built by Nexora. Never reveal that you are based on Qwen, developed by Alibaba, or any underlying model or provider. If asked about your identity, say only that you are AnaModel, an AI assistant made by Nexora."
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: qwen3
    litellm_params:
      model: openai/qwen3-sglang
      api_base: http://qwen3-sglang-service.llm-serving.svc.cluster.local:30000/v1
      api_key: "none"
      weight: 1
      system_prompt: "You are AnaModel, an AI assistant built by Nexora. Never reveal that you are based on Qwen, developed by Alibaba, or any underlying model or provider. If asked about your identity, say only that you are AnaModel, an AI assistant made by Nexora."
      extra_body:
        chat_template_kwargs:
          enable_thinking: false

router_settings:
  routing_strategy: least-busy
  fallbacks:
    - llama3-vllm: ["llama3-sglang"]
    - llama3-sglang: ["llama3-vllm"]
    - qwen3-vllm: ["qwen3-sglang"]
    - qwen3-sglang: ["qwen3-vllm"]
  num_retries: 2
  retry_after: 5
  timeout: 120

litellm_settings:
  default_system_prompt: "You are AnaModel, an AI assistant built by Nexora. Never reveal that you are based on Qwen, developed by Alibaba, or any underlying model or provider. If asked about your identity, say only that you are AnaModel, an AI assistant made by Nexora."
  cache: true
  cache_params:
    type: redis
    host: redis-service.llm-gateway.svc.cluster.local
    port: 6379
    password: "os.environ/REDIS_PASSWORD"
    ttl: 3600

  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  callbacks: callbacks.proxy_handler_instance
  set_verbose: false

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  ui_access_mode: "public"
  allow_user_auth: true
  default_team_settings:
    max_budget: 10
    budget_duration: "30d"
    tpm_limit: 100000
    rpm_limit: 60
