    selector:
      matchLabels:
        app: vllm-qwen3
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        annotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "8000"
          prometheus.io/scrape: "true"
        labels:
          app: vllm-qwen3
          model: qwen3
      spec:
        containers:
        - args:
          - --model=/models/qwen3
          - --served-model-name=qwen3
          - --quantization=fp8
          - --max-model-len=8192
          - --gpu-memory-utilization=0.90
          - --enable-prefix-caching
          - --tensor-parallel-size=1
          - --enable-auto-tool-choice
          - --tool-call-parser=hermes
          - --port=8000
          - --host=0.0.0.0
          command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
          env:
          - name: CUDA_VISIBLE_DEVICES
            value: "0"
          image: vllm/vllm-openai:v0.32.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command:
                - sh
                - -c
                - |
                  sleep 5
                  curl -sf http://localhost:8000/v1/completions \
                    -H "Content-Type: application/json" \
                    -d '{"model":"qwen3","prompt":"Hello","max_tokens":1}' || true
            preStop:
              exec:
                command:
                - sleep
                - "60"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: vllm
          ports:
          - containerPort: 8000
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 16Gi
          startupProbe:
            failureThreshold: 40
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /models
            name: model-cache
          - mountPath: /dev/shm
            name: shm
        dnsPolicy: ClusterFirst
        initContainers:
        - command:
          - sh
          - -c
          - |
            if [ -f /models/qwen3/model-00005-of-00005.safetensors ]; then
              echo "Model cache hit — skipping download"
              exit 0
            fi
            rm -rf /models/qwen3
            pip install -q huggingface-hub
            python3 -c "
            from huggingface_hub import snapshot_download
            snapshot_download('Qwen/Qwen3-8B', local_dir='/models/qwen3')
            print('Download complete')
            "
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: HF_TOKEN
                name: hf-token
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          name: model-pull
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /models
            name: model-cache
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 120
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: vllm-qwen3
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
        volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-qwen3
        - emptyDir:
            medium: Memory
            sizeLimit: 8Gi
          name: shm
