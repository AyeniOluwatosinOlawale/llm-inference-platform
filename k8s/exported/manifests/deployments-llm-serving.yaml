  spec:
    progressDeadlineSeconds: 600
    replicas: 0
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: sglang-llama3
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        annotations:
          prometheus.io/path: /metrics
          prometheus.io/port: "30000"
          prometheus.io/scrape: "true"
        labels:
          app: sglang-llama3
          engine: sglang
          model: llama3
      spec:
        containers:
        - args:
          - --model-path=/models/llama3
          - --served-model-name=llama3-sglang
          - --quantization=awq
          - --context-length=8192
          - --mem-fraction-static=0.88
          - --enable-prefix-caching
          - --tp=1
          - --port=30000
          - --host=0.0.0.0
          - --enable-metrics
          command:
          - python
          - -m
          - sglang.launch_server
          env:
          - name: CUDA_VISIBLE_DEVICES
            value: "0"
          image: lmsysorg/sglang:v0.5.20-cu121
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command:
                - sh
                - -c
                - |
                  sleep 5
                  curl -sf http://localhost:30000/v1/completions \
                    -H "Content-Type: application/json" \
                    -d '{"model":"llama3-sglang","prompt":"Hello","max_tokens":1}' || true
            preStop:
              exec:
                command:
                - sleep
                - "60"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: sglang
          ports:
          - containerPort: 30000
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 16Gi
          startupProbe:
            failureThreshold: 40
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 1
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /models
            name: model-cache
          - mountPath: /dev/shm
            name: shm
        dnsPolicy: ClusterFirst
        initContainers:
        - command:
          - sh
          - -c
          - |
            if [ -d /models/llama3 ]; then
              echo "Model cache hit — skipping download"
              exit 0
            fi
            huggingface-cli download \
              meta-llama/Meta-Llama-3.1-8B-Instruct-AWQ \
              --local-dir /models/llama3 \
              --token "$HF_TOKEN"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: HF_TOKEN
                name: hf-token
          image: huggingface/downloader:latest
          imagePullPolicy: Always
          name: model-pull
