# Secrets referenced by the LiteLLM deployment.
# Values are populated at deploy time from environment variables.
# DO NOT hardcode values here — this file is committed to git.
#
# Apply with:
#   kubectl create secret generic litellm-secrets -n llm-gateway \
#     --from-literal=LITELLM_MASTER_KEY="$LITELLM_MASTER_KEY" \
#     --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
#     --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
#     --from-literal=DATABASE_URL="postgresql://litellm:$POSTGRES_PASSWORD@postgres-service:5432/litellm" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# This placeholder schema documents expected keys for CI/CD pipelines.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: llm-gateway
type: Opaque
# stringData values injected by Makefile `deploy-litellm` target from .env.secrets
stringData:
  LITELLM_MASTER_KEY: ""
  REDIS_PASSWORD: ""
  POSTGRES_PASSWORD: ""
  DATABASE_URL: ""
