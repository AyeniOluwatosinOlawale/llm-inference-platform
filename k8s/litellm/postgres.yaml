apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-gateway
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "litellm"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: llm-gateway
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ServiceAccount for the backup CronJob — annotated with the IRSA role ARN
# from: terraform output -raw pg_backup_role_arn
# Substitute the annotation value before applying or let deploy-litellm handle it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: llm-gateway
  annotations:
    eks.amazonaws.com/role-arn: "${PG_BACKUP_ROLE_ARN}"
---
# Daily pg_dump CronJob — pipes directly to S3 (30-day retention set in Terraform).
# Replaces the previous local-PVC approach which lost backups on node eviction.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: llm-gateway
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: postgres-backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  apk add --no-cache aws-cli > /dev/null 2>&1
                  FNAME="backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump -h postgres-service -U litellm litellm \
                    | gzip \
                    | aws s3 cp - "s3://${PG_BACKUP_BUCKET}/${FNAME}"
                  echo "Backup written to s3://${PG_BACKUP_BUCKET}/${FNAME}"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: litellm-secrets
                      key: POSTGRES_PASSWORD
                - name: PG_BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: backup-config
                      key: PG_BACKUP_BUCKET
---
# ConfigMap holding the backup bucket name.
# Populated by deploy-litellm from: terraform output -raw pg_backup_bucket
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-config
  namespace: llm-gateway
data:
  PG_BACKUP_BUCKET: "${PG_BACKUP_BUCKET}"
