apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm-gateway
data:
  config.yaml: |
    model_list:
      # ── vLLM backends ─────────────────────────────────────────────────────────
      - model_name: llama3-vllm
        litellm_params:
          model: openai/llama3
          api_base: http://llama3-vllm-service.llm-serving.svc.cluster.local:8000/v1
          api_key: "none"
          rpm: 60
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000002

      - model_name: qwen3-vllm
        litellm_params:
          model: openai/qwen3
          api_base: http://qwen3-service.llm-serving.svc.cluster.local:8000/v1
          api_key: "none"
          rpm: 60
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000002
          extra_body:
            chat_template_kwargs:
              enable_thinking: false

      - model_name: AnaModel
        litellm_params:
          model: openai/qwen3
          api_base: http://qwen3-service.llm-serving.svc.cluster.local:8000/v1
          api_key: "none"
          rpm: 60
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000002
          extra_body:
            chat_template_kwargs:
              enable_thinking: false

      # ── SGLang backends ────────────────────────────────────────────────────────
      - model_name: llama3-sglang
        litellm_params:
          model: openai/llama3-sglang
          api_base: http://llama3-sglang-service.llm-serving.svc.cluster.local:30000/v1
          api_key: "none"
          rpm: 60
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000002

      - model_name: qwen3-sglang
        litellm_params:
          model: openai/qwen3-sglang
          api_base: http://qwen3-sglang-service.llm-serving.svc.cluster.local:30000/v1
          api_key: "none"
          rpm: 60
          input_cost_per_token: 0.0000002
          output_cost_per_token: 0.0000002

      # ── 70B model (4x tensor parallel, vLLM only) ────────────────────────────
      - model_name: llama3-70b
        litellm_params:
          model: openai/llama3-70b
          api_base: http://llama3-70b-vllm-service.llm-serving.svc.cluster.local:8000/v1
          api_key: "none"
          rpm: 10
          input_cost_per_token:  0.0000008
          output_cost_per_token: 0.0000008

      # ── Virtual aliases (weighted routing across both engines) ─────────────────
      # Default: 50/50 split between vLLM and SGLang.
      # Adjust with: make canary ENGINE=vllm WEIGHT=90   (shift 90% to vLLM)
      #              make promote ENGINE=vllm              (100% to vLLM)
      #              make rollback                         (reset to 50/50)
      - model_name: llama3
        litellm_params:
          model: openai/llama3
          api_base: http://llama3-vllm-service.llm-serving.svc.cluster.local:8000/v1
          api_key: "none"
          weight: 1
      - model_name: llama3
        litellm_params:
          model: openai/llama3-sglang
          api_base: http://llama3-sglang-service.llm-serving.svc.cluster.local:30000/v1
          api_key: "none"
          weight: 1

      - model_name: qwen3
        litellm_params:
          model: openai/qwen3
          api_base: http://qwen3-service.llm-serving.svc.cluster.local:8000/v1
          api_key: "none"
          weight: 1
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
      - model_name: qwen3
        litellm_params:
          model: openai/qwen3-sglang
          api_base: http://qwen3-sglang-service.llm-serving.svc.cluster.local:30000/v1
          api_key: "none"
          weight: 1
          extra_body:
            chat_template_kwargs:
              enable_thinking: false

    router_settings:
      routing_strategy: least-busy
      fallbacks:
        - llama3-vllm: ["llama3-sglang"]
        - llama3-sglang: ["llama3-vllm"]
        - qwen3-vllm: ["qwen3-sglang"]
        - qwen3-sglang: ["qwen3-vllm"]
      num_retries: 2
      retry_after: 5
      timeout: 120

    litellm_settings:
      cache: true
      cache_params:
        type: redis
        host: redis-service.llm-gateway.svc.cluster.local
        port: 6379
        password: "os.environ/REDIS_PASSWORD"
        ttl: 3600

      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      set_verbose: false
      custom_callback_module: /etc/litellm/callbacks.py

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: "os.environ/DATABASE_URL"
      store_model_in_db: true
      ui_access_mode: "all"
      allow_user_auth: true
      default_team_settings:
        max_budget: 10
        budget_duration: "30d"
        tpm_limit: 100000
        rpm_limit: 60
