apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: llm-gateway
  labels:
    app: litellm-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.40.0
          args:
            - --config=/etc/litellm/config.yaml
            - --port=4000
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: REDIS_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
            # Distributed tracing — sends spans to the OTel Collector → Tempo.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "litellm-proxy"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: callbacks
              mountPath: /etc/litellm/callbacks.py
              subPath: callbacks.py
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: callbacks
          configMap:
            name: litellm-callbacks
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy-service
  namespace: llm-gateway
  labels:
    app: litellm-proxy
spec:
  selector:
    app: litellm-proxy
  ports:
    - name: http
      port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm-proxy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - llm-gateway
  selector:
    matchLabels:
      app: litellm-proxy
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
