# HTTPS ingress for Grafana and Prometheus via Traefik.
# TLS cert issued by letsencrypt-prod via cert-manager (monitoring-tls-secret).
# Grafana credentials: admin / llm-platform-admin (kube-prometheus-stack-grafana secret)

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-tls
  namespace: monitoring
spec:
  secretName: monitoring-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana.136.65.123.94.nip.io
    - prometheus.136.65.123.94.nip.io

---
# Grafana — https://grafana.136.65.123.94.nip.io
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.136.65.123.94.nip.io`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: monitoring-tls-secret

---
# Prometheus — https://prometheus.136.65.123.94.nip.io
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.136.65.123.94.nip.io`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
  tls:
    secretName: monitoring-tls-secret
