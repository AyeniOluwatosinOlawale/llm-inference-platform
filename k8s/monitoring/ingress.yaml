# Public ingress for Grafana and Prometheus via Traefik.
# No gateway basicAuth — Grafana and Prometheus each have their own login.
# Grafana credentials: admin / llm-platform-admin (kube-prometheus-stack-grafana secret)

---
# Grafana — grafana.136.65.123.94.nip.io
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.136.65.123.94.nip.io`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80

---
# Prometheus — prometheus.136.65.123.94.nip.io
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`prometheus.136.65.123.94.nip.io`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
