apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-ingressroute-https
  namespace: llm-gateway
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.136.65.123.94.nip.io`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: litellm-proxy-service
          port: 80
  tls:
    secretName: anamodel-tls-secret
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: agent-ingressroute-https
  namespace: llm-gateway
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.136.65.123.94.nip.io`) && PathPrefix(`/agent`)
      kind: Rule
      middlewares:
        - name: agent-strip-prefix
      services:
        - name: anamodel-agent-service
          port: 80
  tls:
    secretName: anamodel-tls-secret
