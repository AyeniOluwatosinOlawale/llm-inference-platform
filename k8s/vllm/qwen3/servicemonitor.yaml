apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-qwen3
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - llm-serving
  selector:
    matchLabels:
      app: vllm-qwen3
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http
