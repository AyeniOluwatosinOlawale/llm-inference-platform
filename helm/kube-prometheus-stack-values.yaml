prometheus:
  prometheusSpec:
    retention: 15d
    # FIX #12: retentionSize cap prevents Prometheus OOMKill on high-cardinality GPU+vLLM metrics.
    retentionSize: "45GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    # Scrape all ServiceMonitors across all namespaces.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    # Allow PrometheusRule CRDs across all namespaces.
    ruleSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # FIX #H: AlertManager notification receivers — without these, alerts fire but go nowhere.
    config:
      global:
        resolve_timeout: 5m
        slack_api_url: "${SLACK_WEBHOOK_URL}"
      templates:
        - /etc/alertmanager/config/*.tmpl
      route:
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: slack-default
        routes:
          - match:
              severity: critical
            receiver: slack-critical
            repeat_interval: 1h
          - match:
              severity: warning
            receiver: slack-default
      receivers:
        - name: slack-default
          slack_configs:
            - channel: "#llm-platform-alerts"
              send_resolved: true
              title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}'
              text: >-
                {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Severity:* {{ .Labels.severity }}
                *Namespace:* {{ .Labels.namespace }}
                {{ end }}
        - name: slack-critical
          slack_configs:
            - channel: "#llm-platform-critical"
              send_resolved: true
              title: ':red_circle: CRITICAL: {{ .GroupLabels.alertname }}'
              text: >-
                {{ range .Alerts }}
                *Alert:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
                *Namespace:* {{ .Labels.namespace }}
                {{ end }}
      inhibit_rules:
        - source_match:
            severity: critical
          target_match:
            severity: warning
          equal: ["alertname", "namespace"]

grafana:
  enabled: true
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  persistence:
    enabled: true
    size: 5Gi
  # FIX #13: sidecar watches for ConfigMaps labelled grafana_dashboard=1 and auto-imports them.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
      folder: /var/lib/grafana/dashboards/llm-platform
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.${DNS_ZONE}
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.${DNS_ZONE}

# Deploy DCGM GPU exporter for GPU-level metrics (sm_utilization, memory, power).
additionalPrometheusRulesMap: {}

dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
