# External Secrets Operator — syncs AWS Secrets Manager → K8s Secrets.
# IRSA role ARN is injected at deploy time by make deploy-eso from terraform output.

installCRDs: true

replicaCount: 2

nodeSelector:
  workload-type: cpu

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "${ESO_ROLE_ARN}"

# Emit metrics for kube-prometheus-stack.
metrics:
  service:
    enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
